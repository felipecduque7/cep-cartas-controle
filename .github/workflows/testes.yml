name: testes

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        # O ubuntu-latest (26.04) não tem mais o Python 3.9; o 24.04 ainda tem.
        os: [ubuntu-24.04, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt pytest
      - name: Instalar a interface web
        if: matrix.python == '3.13'
        run: python -m pip install -r requirements-web.txt
      - name: Rodar os testes
        run: python -m pytest -q
